<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Своя игра · LaserLand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f19; --bg2:#0f1524; --card:#121a2c; --card2:#16203a; --line:#25304a; --line2:#34405e;
  --text:#f3f5fa; --muted:#98a2b8; --dim:#6b7590;
  --lime:#cdf54d; --lime-d:#a9cf2c; --lime-bg:rgba(205,245,77,.08);
  --err:#ff8a9b; --err-bg:#331a24; --err-line:#6b2d3d;
  --blue:#3d8bff;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:Rubik,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
img{display:block;max-width:100%}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 48px;border-bottom:1px solid #1b2236;position:sticky;top:0;background:rgba(11,15,25,.92);backdrop-filter:blur(8px);z-index:20}
.brand{display:flex;align-items:center;gap:16px;cursor:pointer}
.brand img{height:44px;border-radius:6px}
.brand span{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#c9d0de;padding-left:16px;border-left:1px solid var(--line2)}
.top-r{display:flex;align-items:center;gap:20px}
.linkbtn{font-weight:500;font-size:14px;display:flex;gap:10px;align-items:center}
.linkbtn i{color:var(--lime);font-style:normal}
.age{border:1px solid var(--line2);border-radius:6px;font-size:12px;padding:5px 8px;color:#c9d0de}

/* common */
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.eyebrow.lime{color:var(--lime)}
h1,h2,h3{font-weight:800;letter-spacing:-.02em;line-height:1.05}
.h-xl{font-size:clamp(40px,5.4vw,76px)}
.h-l{font-size:clamp(32px,3.6vw,48px)}
.h-m{font-size:clamp(24px,2.4vw,32px)}
.lime{color:var(--lime)}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:14px;background:var(--lime);color:#0b0f19;font-weight:700;padding:16px 26px;border-radius:10px;transition:transform .15s,background .15s;font-size:15px}
.btn:hover{background:#d9ff5e;transform:translateY(-1px)}
.btn:disabled{background:#2a3247;color:#6b7590;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line2)}
.btn.ghost:hover{border-color:var(--lime);background:transparent}
.btn.wide{width:100%}
.arrow{font-size:18px;line-height:1}

/* wizard layout */
.wiz{max-width:1400px;margin:0 auto;padding:0 48px 80px}
.progress{display:grid;grid-template-columns:140px 1fr 80px;align-items:center;gap:20px;padding:22px 0 0}
.progress .back{font-size:13px;color:#c9d0de;text-align:left}
.progress .back:hover{color:var(--lime)}
.progress .mid{text-align:center}
.progress .cnt{text-align:right;font-weight:600;font-size:18px;color:#c9d0de}
.progress .cnt b{color:var(--text)}
.bars{display:flex;gap:6px;margin-top:12px;grid-column:1/-1}
.bars i{flex:1;height:3px;border-radius:2px;background:#232b40}
.bars i.on{background:var(--lime)}
.cols{display:grid;grid-template-columns:190px minmax(0,1fr) 420px;gap:40px;margin-top:30px;align-items:start}
.side{position:sticky;top:96px}
.side img{width:150px;margin:0 auto 18px}
.tip{border-left:2px solid var(--lime);padding:2px 0 2px 14px;font-size:13px;color:#c9d0de}
.tip b{display:block;color:var(--lime);margin-bottom:8px;font-weight:600}
.main h1{margin:10px 0 16px}
.lead{color:#b9c1d2;font-size:16px;margin-bottom:28px}

/* fields */
.field{margin-bottom:22px}
.field label{display:block;font-weight:700;margin-bottom:10px}
.inp{width:100%;background:#0d1322;border:1px solid var(--line2);border-radius:10px;padding:14px 16px;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--lime)}
.inp.bad{border-color:var(--err)}
textarea.inp{min-height:110px;resize:vertical}
.hint{display:flex;justify-content:space-between;gap:16px;font-size:13px;color:var(--muted);margin-top:8px}
.hint .c{font-weight:700;color:var(--lime);white-space:nowrap}
.hint .c.bad{color:var(--err)}
.ferr{color:var(--err);font-size:13px;margin-top:8px}
.todo{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:8px 0 22px;font-size:14px}
.todo ul{margin:8px 0 0 18px}
.todo li{color:#d6dbe6;text-decoration:underline;text-underline-offset:3px;text-decoration-color:#4a5574}
.sep{border:0;border-top:1px solid var(--line);margin:26px 0}
.navrow{display:flex;gap:14px;align-items:center;margin-top:28px;flex-wrap:wrap}

/* choice cards */
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:12px;transition:border-color .15s,background .15s;position:relative}
.opt:hover{border-color:var(--line2)}
.opt.on{border-color:var(--lime);background:#172014;box-shadow:0 0 0 1px var(--lime) inset}
.opt .n{font-family:ui-monospace,Menlo,monospace;color:var(--lime);font-size:14px}
.opt h3{font-size:20px;margin:6px 0 8px;letter-spacing:0}
.opt p{color:#b9c1d2;font-size:14px}
.opt .tag{display:inline-block;margin-top:12px;font-size:12px;color:var(--lime)}
.opt .dot{position:absolute;right:20px;top:20px;width:20px;height:20px;border-radius:50%;border:2px solid #4a5574}
.opt.on .dot{border-color:var(--lime);background:radial-gradient(var(--lime) 45%,transparent 50%)}
.ans{display:flex;align-items:center;gap:16px}
.ans .n{min-width:22px;color:var(--muted)}
.ans .ar{margin-left:auto;color:var(--lime);font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 16px}
.chip{border:1px solid var(--line2);border-radius:999px;padding:7px 14px;font-size:13px;background:#0d1322}
.chip.on{background:var(--lime);color:#0b0f19;border-color:var(--lime);font-weight:600}
.chip small{opacity:.7;margin-left:4px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg.six{grid-template-columns:repeat(6,1fr)}
.seg button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 14px;text-align:left;display:flex;align-items:center;gap:10px;font-size:14px}
.seg button:before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid #4a5574;flex:none}
.seg button.on{border-color:var(--lime);background:#172014}
.seg button.on:before{border-color:var(--lime);background:radial-gradient(var(--lime) 40%,transparent 45%)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.seg button small{display:block;font-size:11px;color:var(--muted)}
.sw{width:10px;height:10px;border-radius:50%;flex:none}

/* worlds */
.worlds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.world{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card);text-align:left;position:relative}
.wart{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:2%;width:100%;height:150px;background-size:cover;background-position:center;overflow:hidden}
.wart img{height:92%;width:auto;max-width:60%;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.wart.thumb{width:56px;height:56px;border-radius:8px;flex:none}
.wart.thumb img{height:100%;max-width:100%}
.wart.big{height:100%}
.wart.card{width:120px;height:120px;border-radius:12px}
.emb{width:20px;height:20px;flex:none}
.world div{padding:12px 16px 14px}
.world b{display:block;font-size:17px;margin-top:2px}
.world.on{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime) inset}
.world .dot{position:absolute;right:12px;top:12px;width:18px;height:18px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35)}
.world.on .dot{border-color:var(--lime);background:radial-gradient(var(--lime) 45%,rgba(0,0,0,.4) 50%)}
.picked{display:flex;align-items:center;gap:14px;background:#151f12;border:1px solid #3c4d1a;border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:14px}
.picked .lime{font-size:12px}

.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
details.wpick summary{color:var(--lime);cursor:pointer;font-size:17px;list-style:none;margin-bottom:6px}
details.wpick summary::-webkit-details-marker{display:none}
details.wpick summary:before{content:"▸ "}
details.wpick[open] summary:before{content:"▾ "}

/* preview */
.pv{position:sticky;top:96px}
.pv .eyebrow{margin-bottom:14px;display:block}
.pvcard{border:1px solid var(--line2);border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#14203d,#0e1529)}
.pvhead{padding:20px 22px 0}
.pvhead small{font-size:11px;font-weight:700;letter-spacing:.14em;color:#c9d0de}
.pvhead h3{font-size:26px;margin:6px 0 4px;letter-spacing:-.01em;word-break:break-word}
.pvhead p{font-size:13px;color:#c9d0de}
.pvimg{margin:14px 0 0;height:190px;position:relative}

.pvimg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,#0e1529)}
.pvteams{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:14px}
.pvteam{background:#0f1830;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
.pvteam b{display:flex;align-items:center;gap:8px}
.pvteam span{color:var(--muted);font-size:12px}
.pvfoot{text-align:center;color:var(--muted);font-size:12px;padding:0 14px 16px}
.pvmode{margin:0 14px 14px;padding:10px 12px;border-radius:10px;background:var(--lime-bg);border:1px solid #3c4d1a;font-size:13px}
.pvnote{font-size:13px;color:var(--dim);text-align:center;margin-top:14px;line-height:1.6}

/* adventure */
.chdots{display:flex;gap:6px;margin:4px 0 22px}
.chdots i{width:28px;height:4px;border-radius:2px;background:#232b40}
.chdots i.on{background:var(--lime)}
.chdots i.cur{background:#5b6a2a}
.tokens{margin:18px 0 8px}
.tokens .chips{margin-top:10px}
.bubble{display:flex;gap:18px;align-items:flex-start;margin-bottom:26px}
.bubble img{width:84px;border-radius:10px;flex:none}
.bubble p{background:var(--card);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:16px 18px;color:#dfe4ee}
.guide{background:#11262a;border:1px solid #1f4a4a;border-radius:var(--r);padding:16px 18px;margin-top:6px;font-size:14px}
.guide .eyebrow{color:#6fe3cf;margin-bottom:8px;display:block}
.guide small{display:block;margin-top:10px;color:var(--muted)}
.guide small b{color:var(--text)}
.demo-note{font-size:12px;color:var(--dim);margin-top:14px}
.mode{border:1px solid var(--lime);border-radius:20px;padding:28px;background:linear-gradient(135deg,#172014,#0f1524);margin:10px 0 6px}
.mode .h-l{margin:8px 0 12px}

/* stepper */
.num{display:flex;align-items:center;gap:0;width:max-content;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.num button{width:46px;height:48px;font-size:20px;background:#0d1322}
.num button:hover{background:#18213a}
.num input{width:70px;height:48px;text-align:center;background:#0d1322;border:0;border-left:1px solid var(--line2);border-right:1px solid var(--line2);outline:none;font-weight:700;font-size:17px}
.team{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:20px 0;border-top:1px solid var(--line)}
.team .tn{font-family:ui-monospace,Menlo,monospace;color:var(--lime);padding-top:12px}
.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}

/* sliders (advanced) */
.rng{padding:16px 0;border-bottom:1px solid var(--line)}
.rng .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.rng .row b{font-weight:700}
.rng .row span{font-weight:700;color:var(--lime);font-size:18px}
.rng p{font-size:13px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--lime);margin-top:10px}
.tog{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.tog p{font-size:13px;color:var(--muted)}
.tog input{width:24px;height:24px;accent-color:var(--lime);flex:none}
.dev{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
.dev h4{font-size:15px;margin-bottom:10px}

/* centers */
.centers{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.center{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card);text-align:left}
.center img{width:100%;height:120px;object-fit:cover}
.center .noimg{display:grid;place-items:center;height:120px;background:radial-gradient(ellipse at center,#2a2f7a 0,#141a3a 60%,#0e1529 100%)}
.center .noimg img{width:110px;height:auto;border-radius:8px;opacity:.9}
.center div{padding:12px 14px 14px;display:flex;gap:10px}
.center div:before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid #4a5574;flex:none;margin-top:2px}
.center.on{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime) inset}
.center.on div:before{border-color:var(--lime);background:radial-gradient(var(--lime) 40%,transparent 45%)}
.center b{display:block}
.center small{color:var(--muted);font-size:12px;line-height:1.4;display:block;margin-top:4px}
.center:disabled{opacity:.5;cursor:not-allowed}
.center div>span{text-align:left;flex:1}
.center small.noarena{color:var(--err)}
.center small.metro{color:var(--text);font-weight:500}
#arenaField{margin-top:26px;scroll-margin-top:90px}

/* alerts */
.alert{background:var(--err-bg);border:1px solid var(--err-line);border-radius:10px;padding:14px 18px;margin-bottom:22px;font-size:14px}
.alert b{display:block;margin-bottom:6px}
.alert ul{margin-left:18px}
.okbox{background:#151f12;border:1px solid #3c4d1a;border-radius:10px;padding:14px 18px;margin-bottom:22px;font-size:14px}
.okbox b{display:block;margin-bottom:4px;color:var(--lime)}

/* landing */
.hero{max-width:1400px;margin:0 auto;padding:40px 48px 60px;display:grid;grid-template-columns:1.05fr 1fr;gap:30px;align-items:center;min-height:calc(100vh - 73px)}
.hero .eyebrow{display:flex;align-items:center;gap:10px;color:#c9d0de}
.hero .eyebrow:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lime)}
.hero h1{margin:26px 0 30px}
.hero p{font-size:17px;color:#d6dbe6;margin-bottom:34px}
.hero .art{position:relative;min-height:520px;display:flex;align-items:center;justify-content:center;isolation:isolate}
.hero .art .arenabg{position:absolute;left:-10%;bottom:0;width:120%;height:80%;object-fit:cover;z-index:-1;opacity:.6;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 25%,#000 85%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 25%,#000 85%,transparent)}
.hero .art .robot{width:88%;max-width:520px;height:auto;filter:drop-shadow(0 25px 45px rgba(36,92,229,.18))}
.float{animation:float 6s ease-in-out infinite}@keyframes float{50%{transform:translateY(-12px)}}
@media (prefers-reduced-motion:reduce){.float{animation:none}}
.hero .art .tagline{position:absolute;right:20px;top:20px;border-left:2px solid var(--lime);padding-left:12px;font-size:11px;letter-spacing:.16em;font-weight:700;color:#c9d0de;background:rgba(11,15,25,.5);padding:6px 10px}
.hero .codeline{margin-top:18px;font-size:14px;color:var(--muted)}
.hero .codeline button{color:var(--text);text-decoration:underline;text-underline-offset:3px}

/* QR sign */
.qrwrap>div{display:flex;flex-direction:column;align-items:center;width:100%}
.qrwrap{min-height:calc(100vh - 73px);display:grid;place-items:center;padding:40px 24px;background:radial-gradient(ellipse at center,#16203a 0,#0b0f19 70%)}
.sign{width:min(420px,100%);background:#f4f6fa;color:#0b0f19;border-radius:22px;padding:30px 30px 26px;box-shadow:0 30px 80px rgba(0,0,0,.5);text-align:center;position:relative}
.sign .lg{height:46px;margin:0 auto 18px;border-radius:6px}
.sign h2{font-size:30px;line-height:1.05;margin-bottom:10px}
.sign p{color:#3a4258;font-size:15px}
.sign .qr{width:200px;height:200px;margin:22px auto 14px;padding:10px;background:#fff;border-radius:14px;border:3px solid #0b0f19}
.sign .qr img{width:100%;height:100%;image-rendering:pixelated}
.sign .url{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:#e3e7ef;border-radius:8px;padding:8px 10px;word-break:break-all}
.ctx{margin-top:26px;text-align:center;color:var(--muted);font-size:14px;max-width:440px}
.ctx .btn{margin-top:16px}
.ctx .eyebrow{display:block;margin-bottom:8px}

/* result page */
.res{max-width:1200px;margin:0 auto;padding:30px 48px 90px}
.res-hero{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;padding:20px 0 60px}
.badge{display:inline-flex;align-items:center;gap:10px;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--lime);text-transform:uppercase}
.badge i{width:18px;height:18px;border-radius:50%;background:var(--lime);color:#0b0f19;font-style:normal;display:grid;place-items:center;font-size:11px}
.res-hero .saved{font-size:17px;margin:40px 0 10px;color:#d6dbe6}
.res-hero .name{font-size:clamp(42px,5.4vw,72px);color:var(--lime);font-weight:800;line-height:1;word-break:break-word}
.res-hero .author{margin:16px 0 14px;font-size:14px;color:var(--lime)}
.res-hero .author b{font-weight:700}
.res-hero p{color:#c9d0de;max-width:440px;margin-bottom:28px}
.res-hero .ph{border:1px solid var(--line2);border-radius:22px;overflow:hidden;position:relative}
.res-hero .ph .wart{height:420px}
.res-hero .ph .phl{position:absolute;left:16px;top:16px;border:1px solid var(--line2);background:rgba(11,15,25,.7);border-radius:6px;padding:5px 9px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.sec-t{display:flex;align-items:baseline;gap:14px;margin:10px 0 22px;flex-wrap:wrap}
.sec-t .h-m{letter-spacing:-.01em}
.pass{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:70px}
.pass>div{background:linear-gradient(180deg,#151e33,#101729);border:1px solid var(--line2);border-radius:18px;padding:24px}
.code{font-family:ui-monospace,Menlo,monospace;color:var(--lime);font-size:30px;font-weight:700;letter-spacing:.06em;margin:14px 0 14px}
.pass p{font-size:13px;color:#b9c1d2;margin-bottom:16px}
.pass .qrrow{display:flex;gap:20px;align-items:center}
.pass .qrbox{width:130px;height:130px;background:#fff;border-radius:10px;padding:8px;flex:none}
.pass .qrbox img{width:100%;height:100%;image-rendering:pixelated}
.pass h3{font-size:22px;margin:6px 0 10px;letter-spacing:0}
.btn.sm{padding:11px 16px;font-size:13px}
.arena{text-align:center;margin-bottom:40px}
.arena p{color:#b9c1d2;font-size:14px;max-width:560px;margin:14px auto 0}
.cardsec{display:grid;grid-template-columns:1fr 420px;gap:40px;align-items:start}
.cardsec .stack{display:flex;flex-direction:column;gap:12px}
.adultl{margin-top:18px;font-size:14px}
.adultl a{text-underline-offset:3px}
.adultl p{font-size:13px;color:var(--muted);margin-top:6px}
.pcard{border:1px solid var(--line2);border-radius:20px;background:linear-gradient(180deg,#14203d,#0e1529);padding:22px;font-size:13px}
.pcard .tp{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;color:#c9d0de}
.pcard .tp img{height:30px;border-radius:4px}
.pcard .hd{display:grid;grid-template-columns:1fr 120px;gap:10px;margin:14px 0}

.pcard h4{font-size:18px}
.pcard .big{font-size:30px;font-weight:800;color:var(--lime);line-height:1.05;word-break:break-word}
.pcard .lbl{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin:12px 0 4px}
.pcard .cd{font-family:ui-monospace,Menlo,monospace;font-size:18px;font-weight:700;margin-top:12px}
.pcard .meta{color:var(--lime);font-size:12px;margin-top:4px}
.pcard .tms{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pcard .tms div{background:#0f1830;border:1px solid var(--line);border-radius:10px;padding:9px 10px;display:flex;gap:8px;align-items:center}
.how{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:24px;margin:-40px 0 60px}
.how ol{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:14px;counter-reset:h}
.how li{counter-increment:h;font-size:14px;color:#b9c1d2;line-height:1.5}
.how li:before{content:counter(h);display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--lime);color:#0b0f19;font-weight:700;font-size:13px;margin-bottom:10px}
.how li b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.how a{color:var(--lime)}
a.btn{text-decoration:none}
.done{margin-top:60px;border:1px solid var(--lime);border-radius:20px;padding:30px;background:linear-gradient(135deg,#172014,#0f1524);display:none}
.done.show{display:block}
.done h2{margin:8px 0 10px}

/* code entry */
.codepg{max-width:640px;margin:0 auto;padding:40px 24px 80px}
.codepg h1{margin:14px 0 14px}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(5,8,14,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.show{display:flex}
.modal .box{background:var(--bg2);border:1px solid var(--line2);border-radius:18px;padding:26px;max-width:460px;width:100%}
.modal h3{font-size:22px;margin:6px 0 10px;letter-spacing:0}
.modal p{color:#c9d0de;font-size:14px;margin-bottom:18px}
.modal .stack{display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--lime);color:#0b0f19;font-weight:600;padding:12px 20px;border-radius:10px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid #232b40;border-top-color:var(--lime);animation:sp 0.8s linear infinite;margin:0 auto 18px}
@keyframes sp{to{transform:rotate(360deg)}}

/* screen map for testers */
.mapbtn{position:fixed;right:18px;bottom:18px;z-index:40;background:#1b2440;border:1px solid var(--line2);border-radius:999px;padding:10px 16px;font-size:13px;color:#c9d0de}
.mapbtn:hover{border-color:var(--lime);color:var(--text)}
.foot{display:none;text-align:center;padding:10px 16px 28px}
.foot button{font-size:12px;color:var(--dim);text-decoration:underline;text-underline-offset:3px}
.map{position:fixed;right:18px;bottom:66px;z-index:41;width:330px;max-height:70vh;overflow:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:16px;padding:18px;display:none;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.map.show{display:block}
.map h4{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.map h4:first-child{margin-top:0}
.map button{display:block;width:100%;text-align:left;padding:6px 8px;border-radius:6px;font-size:13px;color:#d6dbe6}
.map button:hover{background:#18213a}
.map button.cur{color:var(--lime)}
.map label{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#c9d0de;margin-top:12px;line-height:1.4}
.map label input{accent-color:var(--lime);margin-top:3px}

@media (max-height:820px) and (min-width:921px){
  .qrwrap{padding:24px}
  .sign{padding:20px 26px 18px;width:min(380px,100%)}
  .sign .lg{height:36px;margin-bottom:10px}
  .sign h2{font-size:24px}
  .sign .qr{width:140px;height:140px;margin:14px auto 10px;padding:6px}
  .ctx{margin-top:16px}
  .ctx .btn{margin-top:10px}
}
@media (max-width:1180px){
  .cols{grid-template-columns:150px minmax(0,1fr) 340px;gap:28px}
  .side img{width:120px}
}
@media (max-width:920px){
  .how ol{grid-template-columns:1fr}
  .how{margin:-24px 0 40px}
  .top{padding:12px 18px}
  .brand img{height:36px}
  .brand span{display:none}
  .top-r{gap:12px}
  .wiz{padding:0 18px 90px}
  .progress{grid-template-columns:1fr auto;gap:10px}
  .progress .mid{display:none}
  .cols{grid-template-columns:1fr;gap:20px;margin-top:20px}
  .side{position:static;display:flex;gap:14px;align-items:center}
  .side img{width:64px;margin:0}
  .tip b{margin-bottom:4px}
  .pv{position:static;order:3}
  .main{order:2}
  .pvimg{height:150px}
  .hero{grid-template-columns:1fr;padding:24px 18px 40px;min-height:0}
  .hero .art{order:-1;min-height:260px}
  .hero .art .robot{width:62%;max-width:260px}
  .hero h1{margin:16px 0 18px}
  .hero .btn{width:100%}
  .res{padding:20px 18px 90px}
  .res-hero,.pass,.cardsec{grid-template-columns:1fr}
  .res-hero .ph .wart{height:260px}
  .res-hero .saved{margin-top:18px}
  .seg{grid-template-columns:repeat(2,1fr)}
  .seg.six{grid-template-columns:repeat(3,1fr)}
  .colors{grid-template-columns:repeat(2,1fr)}
  .worlds,.centers{grid-template-columns:1fr 1fr}
  .world .wart{height:110px}
  .center img,.center .noimg{height:90px}
  .center .noimg img{height:auto;width:90px}
  .navrow .btn{flex:1}
  .map{left:12px;right:12px;width:auto}
  .mapbtn{display:none}
  .foot{display:block}
}
@media (max-width:520px){
  .linkbtn{font-size:13px}
  .age{display:none}
  .worlds,.centers{grid-template-columns:1fr}
  .pass .qrrow{flex-direction:column;align-items:flex-start}
  .code{font-size:24px}
  .team{grid-template-columns:1fr}
  .team .tn{padding-top:0}
}
</style>

const NAME_RE = /^[A-Za-zА-Яа-яЁё0-9 \-]+$/;
const TEAM_RE = /^[A-Za-zА-Яа-яЁё '’\-]+$/;
function nameErr(){const v=S.name.trim();
  if(!v) return "Придумай название: от 1 до 15 символов.";
  const bad=[...v].find(ch=>!/[A-Za-zА-Яа-яЁё0-9 \-]/.test(ch));
  if(bad) return `Символ «${bad}» не подходит. Можно буквы, цифры, пробел и дефис.`;
  if(v.length>15) return `Название длиннее 15 символов: сейчас ${v.length}. Сократи его.`;
  return ""}
function nickErr(){const v=S.nick.trim(); if(!v||v.length>20) return "Придумай игровой ник: от 1 до 20 символов. Только вымышленный."; return ""}
function legendErr(){return S.legend.length>300?"Легенда не длиннее 300 символов.":""}
function teamErrs(){
  const errs=[];
  if(S.teams.length>S.players) errs.push("Команд не больше, чем игроков.");
  if(!isAdv() && quizDone() && !computeMode()) errs.push("Для такого состава пока нет подтверждённого режима. Измените число команд.");
  S.teams.forEach((t,i)=>{
    const v=t.name.trim();
    if(!v) errs.push(`Придумай название команды ${i+1}.`);
    else if(!TEAM_RE.test(v)) errs.push(`Команда ${i+1}: в названии можно использовать буквы, пробел, дефис и апостроф.`);
  });
  return errs;
}

/* ---------- render + bind ---------- */
function render(){
  $("#app").innerHTML = V[S.screen]();
  bind();
}

function rerenderKeepFocus(){
  const a=document.activeElement, id=a&&a.id, pos=a&&a.selectionStart;
  const y=window.scrollY; render(); window.scrollTo(0,y);
  if(id){const el=document.getElementById(id); if(el){el.focus(); try{el.setSelectionRange(pos,pos)}catch(e){}}}
  saveDraft();
}

function bind(){
  const on=(sel,ev,fn)=>document.querySelectorAll(sel).forEach(el=>el.addEventListener(ev,fn));

  // home
  on("#startBtn","click",()=>{ if(loadDraft()) go("restore"); else {S=fresh(); go("s1")} });
  on("#contDraft","click",()=>{ const d=loadDraft(); if(d){S=Object.assign(fresh(),d); S.restored=true; go(d.screen||"s1")} });
  on("#newGame","click",()=>{ store.del(DRAFT_KEY); S=fresh(); go("s1") });

  // step 1
  const live=(id,key,max,cid)=>on(id,"input",e=>{
    S[key]=e.target.value;
    S.touched[key==="legend"?"legend":key]=true;
    rerenderKeepFocus();
  });
  live("#fName","name");
  live("#fNick","nick");
  live("#fLeg","legend");
  on("#fQ","input",e=>{S.q=e.target.value; rerenderKeepFocus()});
  on("[data-cat]","click",e=>{S.cat=e.currentTarget.dataset.cat; rerenderKeepFocus()});
  on("#wMore","click",()=>{S.wAll=true; rerenderKeepFocus()});
  on("[data-world]","click",e=>{S.world=e.currentTarget.dataset.world; rerenderKeepFocus()});
  on("#next1","click",()=>{S.touched.name=S.touched.nick=true; if(!nameErr()&&!nickErr()&&!legendErr()) go("s2"); else rerenderKeepFocus()});

  // step 2
  on("[data-path]","click",e=>{S.path=e.currentTarget.dataset.path; rerenderKeepFocus()});
  on("#next2","click",()=>go(S.path==="manual"?"a1":"s3"));

  // step 3
  on("[data-ans]","click",e=>{const q=QUIZ.q[S.ch]; S.answers[q.id]=e.currentTarget.dataset.ans; rerenderKeepFocus()});
  on("#chNext","click",()=>{ if(S.ch<QUIZ.q.length-1){S.ch++; go("s3")} else go("s3r") });
  on("#chBack","click",()=>{ if(S.ch>0){S.ch--; go("s3")} else go("s2") });
  on("#toLastCh","click",()=>{S.ch=QUIZ.q.length-1; go("s3")});

  // teams
  on("[data-pl]","click",e=>{setPlayers(S.players + +e.currentTarget.dataset.pl)});
  on("#fPl","change",e=>{setPlayers(parseInt(e.target.value,10)||2)});
  on("[data-tc]","click",e=>{
    const n=+e.currentTarget.dataset.tc;
    while(S.teams.length<n){const free=COLORS.find(c=>!S.teams.some(t=>t.color===c.id)); S.teams.push({name:"",color:free.id})}
    S.teams.length=n; rerenderKeepFocus();
  });
  on("[data-tname]","input",e=>{S.teams[+e.target.dataset.tname].name=e.target.value; if(S.touched.teams) rerenderKeepFocus(); else saveDraft()});
  on("[data-tcol]","click",e=>{const [i,c]=e.currentTarget.dataset.tcol.split(":"); S.teams[+i].color=c; rerenderKeepFocus()});
  on("#nextTeams","click",()=>{S.touched.teams=true; if(teamErrs().length){rerenderKeepFocus(); document.querySelector(".alert")?.scrollIntoView({behavior:"smooth",block:"center"}); return} go(isAdv()?"a4":"s5")});

  // advanced
  on("[data-adv]","input",e=>{const k=e.target.dataset.adv; S.adv[k]=+e.target.value; $("#v_"+k).textContent=S.adv[k]+(e.target.dataset.unit||""); saveDraft()});
  on("[data-advb]","change",e=>{S.adv[e.target.dataset.advb]=e.target.checked; rerenderKeepFocus()});
  on("[data-weap]","click",e=>{S.adv.weapon=e.currentTarget.dataset.weap; rerenderKeepFocus()});
  on("[data-ff]","click",e=>{S.adv.ff=e.currentTarget.dataset.ff; rerenderKeepFocus()});
  on("[data-trule]","click",e=>{S.adv.teamRule=e.currentTarget.dataset.trule; rerenderKeepFocus()});
  on("[data-role]","click",e=>{const [i,r]=e.currentTarget.dataset.role.split(":"); S.adv.devices[+i].role=r; rerenderKeepFocus()});
  on("[data-devpts]","input",e=>{const i=+e.target.dataset.devpts; S.adv.devices[i].pts=+e.target.value; $("#v_dev"+i).textContent=e.target.value; saveDraft()});

  // place + create
  on("[data-center]","click",e=>{const v=e.currentTarget.dataset.center||null; if(v!==S.center){S.center=v; S.arena=null} rerenderKeepFocus(); if(v) $("#arenaField")?.scrollIntoView({behavior:"smooth",block:"start"})});
  on("[data-arena]","click",e=>{S.arena=e.currentTarget.dataset.arena||null; rerenderKeepFocus()});
  on("#create","click",createGame);

  // result
  on("#toPass","click",()=>$("#r-pass").scrollIntoView({behavior:"smooth"}));
  on("#toHow","click",()=>$("#r-how").scrollIntoView({behavior:"smooth"}));
  on("#shareTop","click",shareCard);
  on("#invite","click",()=>copy(shareUrl(),"Ссылка на игру скопирована. Отправь её друзьям"));
  on("#copyLink","click",()=>copy(shareUrl(),"Ссылка скопирована"));
  on("[data-occ]","click",e=>{S.occasion=e.currentTarget.dataset.occ; const y=window.scrollY; render(); window.scrollTo(0,y); persistGame()});
  on("#dl","click",downloadCard);
  on("#share","click",shareCard);

  // code entry
  on("#openCode","click",openByCode);
  on("#fCode","keydown",e=>{if(e.key==="Enter")openByCode()});
}

function setPlayers(n){
  n=Math.max(2,Math.min(24,n)); S.players=n;
  const a=arena(); if(a&&a.cap<n) S.arena=null;
  if(S.teams.length>n) S.teams.length=n;
  rerenderKeepFocus();
}

function createGame(){
  S.saveErr=false;
  go("saving");
  setTimeout(()=>{
    if(S.failNext){ S.failNext=false; S.saveErr=true; renderMap(); go("s5"); return }
    if(!S.code) S.code=genCode();   // повтор не создаёт новую игру
    persistGame();
    store.del(DRAFT_KEY);
    go("result");
  },1100);
}
function persistGame(){
  const games=store.get(GAMES_KEY)||{};
  games[S.code]=JSON.parse(JSON.stringify(S));
  store.set(GAMES_KEY,games);
}
function openByCode(){
  const raw=($("#fCode").value||"").toUpperCase().replace(/[\s\-]/g,"");
  const games=store.get(GAMES_KEY)||{};
  if(raw.length===10 && games[raw]){ S=Object.assign(fresh(),games[raw]); go("result"); return }
  S.codeErr=true; render(); $("#fCode").value=$("#fCode").value; renderMap();
}
function copy(text,msg){
  const done=()=>toast(msg);
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(done,()=>fallbackCopy(text,done))}
  else fallbackCopy(text,done);
}
function fallbackCopy(text,done){const t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();try{document.execCommand("copy")}catch(e){}t.remove();done()}

/* card PNG */
function loadImg(src){return new Promise(r=>{const i=new Image();if(/^https?:/.test(src))i.crossOrigin="anonymous";i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
function wrap(ctx,text,x,y,maxW,lh,maxLines=4){
  const words=text.split(/\s+/);let line="",n=0;
  for(const w of words){const t=line?line+" "+w:w; if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line,x,y);y+=lh;line=w;if(++n>=maxLines-1){break}} else line=t}
  if(line){ctx.fillText(line,x,y);y+=lh}
  return y;
}
async function makeCard(){
  await (document.fonts?document.fonts.ready:Promise.resolve());
  const W=1080,H=1350,cv=document.createElement("canvas");cv.width=W;cv.height=H;const x=cv.getContext("2d");
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#14203d");g.addColorStop(1,"#0b0f19");x.fillStyle=g;x.fillRect(0,0,W,H);
  const [logo,wbg,wimg,qr]=await Promise.all([loadImg(IMG.logo),loadImg(world().cover),loadImg(world().img),loadImg(IMG.qr)]);
  if(logo){const h=80,w2=logo.width*h/logo.height; x.drawImage(logo,70,64,w2,h)}
  x.fillStyle="#c9d0de";x.font="700 28px Rubik, sans-serif";x.fillText("/ СВОЯ ИГРА",220,118);
  x.save();x.beginPath();x.roundRect(700,190,310,310,28);x.clip();x.fillStyle="#14203d";x.fillRect(700,190,310,310);
  if(wbg){const r=Math.max(310/wbg.width,310/wbg.height);x.drawImage(wbg,700+(310-wbg.width*r)/2,190+(310-wbg.height*r)/2,wbg.width*r,wbg.height*r)}
  if(wimg){const r=Math.min(280/wimg.width,290/wimg.height);x.drawImage(wimg,700+(310-wimg.width*r)/2,190+310-wimg.height*r,wimg.width*r,wimg.height*r)}
  x.restore();
  x.fillStyle="#fff";x.font="800 46px Rubik, sans-serif";x.fillText("Я придумал игру.",70,240);
  x.fillStyle="#cdf54d";x.font="800 92px Rubik, sans-serif";let y=wrap(x,S.name,70,350,600,96,2);
  x.fillStyle="#98a2b8";x.font="400 30px Rubik, sans-serif";x.fillText("Автор: "+S.nick,70,y+10);
  y=Math.max(y+80,560);
  const lbl=(t)=>{x.fillStyle="#98a2b8";x.font="700 22px Rubik, sans-serif";x.fillText(t.toUpperCase(),70,y);y+=42};
  lbl("Тематика приключения");x.fillStyle="#fff";x.font="700 34px Rubik, sans-serif";x.fillText(world().name,70,y);y+=60;
  const cm=isAdv()?"Свой режим":((quizDone()&&computeMode())?computeMode().title:"");
  if(cm){lbl("Режим");x.fillStyle="#fff";x.font="700 34px Rubik, sans-serif";x.fillText(cm,70,y);y+=60}
  y+=10;
  x.font="700 44px ui-monospace, Menlo, monospace";x.fillText("КОД "+fmtCode(S.code),70,y);y+=50;
  x.fillStyle="#cdf54d";x.font="500 28px Rubik, sans-serif";x.fillText(`Игроков: ${S.players} · Команд: ${S.teams.length} · ${S.occasion==="bday"?"День рождения":"Просто игра"}`,70,y);y+=70;
  if(S.legend.trim()){lbl("Моя легенда");x.fillStyle="#fff";x.font="400 30px Rubik, sans-serif";y=wrap(x,S.legend,70,y,940,40,3)+26}
  lbl("Хочу сыграть здесь");x.fillStyle="#fff";x.font="700 30px Rubik, sans-serif";y=wrap(x,placeText(),70,y,940,38,2)+26;
  lbl("Команды на старте");
  S.teams.forEach((t,i)=>{const cx=70+(i%3)*315,cy=y+Math.floor(i/3)*70;x.fillStyle=color(t.color).hex;x.beginPath();x.arc(cx+14,cy-10,14,0,7);x.fill();x.fillStyle="#fff";x.font="700 30px Rubik, sans-serif";x.fillText(t.name,cx+40,cy)});
  y+=Math.ceil(S.teams.length/3)*70+20;
  x.fillStyle="#fff";x.beginPath();x.roundRect(70,H-250,190,190,18);x.fill();if(qr)x.drawImage(qr,82,H-238,166,166);
  x.fillStyle="#fff";x.font="700 32px Rubik, sans-serif";x.fillText("Программы праздников",290,H-180);
  x.fillStyle="#98a2b8";x.font="400 26px Rubik, sans-serif";wrap(x,"Наведи камеру на QR: откроется сайт LaserLand, там можно узнать стоимость и оставить заявку.",290,H-136,700,36,3);
  return cv;
}
async function downloadCard(){
  const cv=await makeCard();
  const a=document.createElement("a");a.download=`svoya-igra-${S.code}.png`;a.href=cv.toDataURL("image/png");document.body.appendChild(a);a.click();a.remove();
  toast("Карточка скачана");
}
async function shareCard(){
  const cv=await makeCard();
  const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
  const file=new File([blob],`svoya-igra-${S.code}.png`,{type:"image/png"});
  const data={files:[file],title:"Я придумал игру. Давай сыграем?",text:`Я придумал игру «${S.name}» в LaserLand. Код ${fmtCode(S.code)}. ${shareUrl()}`};
  if(navigator.canShare&&navigator.canShare(data)){
    try{await navigator.share(data); sent(); return}catch(e){ if(e.name==="AbortError") return }
  }
  modal(`<span class="eyebrow">Нельзя отправить файл</span>
    <h3>Отправим по-другому</h3>
    <p>На этом устройстве не открылось меню «Поделиться». Скачай карточку и отправь её родителю вместе со ссылкой на игру в любом мессенджере.</p>
    <div class="stack">
      <button class="btn wide" id="m_dl">Скачать карточку PNG ↓</button>
      <button class="btn ghost wide" id="m_copy">Скопировать ссылку на игру</button>
      <button class="btn ghost wide" id="m_ok">Готово, отправил</button>
    </div>`);
  $("#m_dl").onclick=downloadCard;
  $("#m_copy").onclick=()=>copy(shareUrl(),"Ссылка скопирована");
  $("#m_ok").onclick=()=>{closeModal();sent()};
}

const MAP = [
  ["Основной путь",[["qr","1. QR-код в центре"],["home","2. Главная страница"],["s1","3. Шаг 1. Замысел"],["s2","4. Шаг 2. Твой путь"],["s3","5. Шаг 3. Приключение"],["s3r","5а. Режим готов"],["s4","6. Шаг 4. Команды"],["s5","7. Шаг 5. Где встретимся?"],["result","8–10. Итог, код и карточка"]]],
  ["Ветка «Настрою сам»",[["a1","A1. Правила"],["a2","A2. Оружие и огонь по своим"],["a3","A3. Команды"],["a4","A4. Устройства и очки"]]],
  ["Ошибки и пустые состояния",[["e1","E1. Неверный код"],["e2","E2. Ошибка в названии"],["e3","E3. Прохождение прервалось"],["e4","E4. Ошибка в составе команд"],["e5","E5. Игра не сохранилась"],["e6","E6. Нельзя отправить файл"],["e7","Арена меньше состава"]]]
];
function ensureGame(){ if(!S.name){S.name="Орбита 7";S.nick="Комета 7";S.legend="Станцию захватили роботы, и две команды спорят, кто первым вернёт себе реактор."} if(!quizDone()) QUIZ.q.forEach(q=>S.answers[q.id]=S.answers[q.id]||q.options[1].id); if(!S.path)S.path="story"; }
function jump(id){
  $("#map").classList.remove("show");
  closeModal();
  if(id==="e1"){S.codeErr=true;go("codeEntry");return}
  if(id==="e2"){S.path=S.path||"story";S.name="Космическая битва 2026";S.touched.name=true;go("s1");return}
  if(id==="e3"){ensureGame(); S.screen="s4"; store.set(DRAFT_KEY,Object.assign(JSON.parse(JSON.stringify(S)),{savedAt:Date.now()})); go("restore");return}
  if(id==="e4"){ensureGame();S.teams=[{name:"Капитаны",color:"red"},{name:"Искры 2",color:"blue"}];S.touched.teams=true;go(isAdv()?"a3":"s4");return}
  if(id==="e5"){ensureGame();S.saveErr=true;go("s5");return}
  if(id==="e7"){ensureGame();S.players=20;S.center="myakinino";S.arena=null;go("s5");setTimeout(()=>$("#arenaField")?.scrollIntoView({block:"start"}),50);return}
  if(id==="e6"){ensureGame();if(!S.code){S.code=genCode();persistGame()}go("result");setTimeout(()=>{$("#r-card").scrollIntoView();$("#share").click()},50);return}
  if(["s3","s3r","s4"].includes(id)){ensureGame(); S.path="story"}
  if(["s5","result"].includes(id)) ensureGame();
  if(id.startsWith("a")){ensureGame();S.path="manual"}
  if(id==="result"&&!S.code){S.code=genCode();persistGame()}
  go(id);
}
function renderMap(){
  $("#map").innerHTML = MAP.map(([t,items])=>`<h4>${t}</h4>${items.map(([id,n])=>`<button data-jump="${id}" class="${S.screen===id?"cur":""}">${n}</button>`).join("")}`).join("")
    + `<label><input type="checkbox" id="failT" ${S.failNext?"checked":""}>Сымитировать обрыв связи при следующем нажатии «Создать игру»</label>`;
  document.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>jump(b.dataset.jump));
  $("#failT").onchange=e=>{S.failNext=e.target.checked};
}
$("#mapBtn").onclick=$("#mapBtn2").onclick=()=>{renderMap();$("#map").classList.toggle("show")};

/* ---------- start ---------- */
(function init(){
  const g=location.hash.match(/g=([A-Za-z0-9_\-]+)/);
  if(g){const d=unpackGame(g[1]); if(d&&d.name&&d.code){S=Object.assign(fresh(),d); S.shared=true; S.screen="result"; persistGame(); render(); renderMap(); return}}
  const m=location.hash.match(/game=([A-Z0-9]{10})/i);
  if(m){const g=(store.get(GAMES_KEY)||{})[m[1].toUpperCase()]; if(g){S=Object.assign(fresh(),g);S.screen="result"} else {S.screen="codeEntry";S.codeErr=true}}
  render(); renderMap();
})();
</script>
